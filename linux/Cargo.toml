[package]
name = "typefix-linux-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Shared English/Persian keyboard-layout mistake detection core"

[lib]
name = "typefix_core"
path = "src/lib.rs"

[[bin]]
name = "typefix"
path = "src/bin/typefix.rs"

[[bin]]
name = "typefix-gui"
path = "src/bin/typefix_gui.rs"
required-features = ["gui"]

[[bin]]
name = "typefix-check"
path = "src/main.rs"

[[bin]]
name = "typefix-x11-probe"
path = "src/bin/x11_probe.rs"

[[bin]]
name = "typefix-x11-events"
path = "src/bin/x11_events.rs"

[dependencies]
x11rb = { version = "0.13", features = ["xinput", "xkb", "xtest"] }
xkbcommon = "0.9"
arboard = { version = "3", default-features = false }
gtk = { version = "0.18", optional = true }

[features]
# The settings window needs the GTK 3 development files (libgtk-3-dev).
gui = ["dep:gtk"]

[dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }

[package.metadata.deb]
name = "typefix"
maintainer = "mamsm-dev <mamsm-dev@users.noreply.github.com>"
copyright = "2026, mamsm-dev"
license-file = ["../LICENSE", "0"]
section = "utils"
priority = "optional"
depends = "$auto, x11-xkb-utils"
recommends = "libnotify-bin"
extended-description = "TypeFix detects English text typed with the Persian keyboard layout (and the reverse) on X11 and suggests the converted text as a desktop notification. It runs in the foreground and never stores or replaces typed text."
assets = [
    ["target/release/typefix", "usr/bin/", "755"],
    ["target/release/typefix-gui", "usr/bin/", "755"],
    ["../Resources/en_50k.txt", "usr/share/typefix/", "644"],
    ["../Resources/fa_50k.txt", "usr/share/typefix/", "644"],
    ["packaging/typefix.desktop", "usr/share/applications/", "644"],
    ["../icon/icon_1024.png", "usr/share/icons/hicolor/1024x1024/apps/typefix.png", "644"],
    ["packaging/icons/typefix-16.png", "usr/share/icons/hicolor/16x16/apps/typefix.png", "644"],
    ["packaging/icons/typefix-32.png", "usr/share/icons/hicolor/32x32/apps/typefix.png", "644"],
    ["packaging/icons/typefix-48.png", "usr/share/icons/hicolor/48x48/apps/typefix.png", "644"],
    ["packaging/icons/typefix-64.png", "usr/share/icons/hicolor/64x64/apps/typefix.png", "644"],
    ["packaging/icons/typefix-128.png", "usr/share/icons/hicolor/128x128/apps/typefix.png", "644"],
    ["packaging/icons/typefix-256.png", "usr/share/icons/hicolor/256x256/apps/typefix.png", "644"],
    ["packaging/icons/typefix-512.png", "usr/share/icons/hicolor/512x512/apps/typefix.png", "644"],
    ["README.md", "usr/share/doc/typefix/README.md", "644"],
]

[package.metadata.generate-rpm]
name = "typefix"
summary = "Keyboard layout mistake detector for English and Persian (X11)"
license = "MIT"
url = "https://github.com/mamsm-dev/TypeFix"
auto-req = "disabled"
assets = [
    { source = "target/release/typefix", dest = "/usr/bin/typefix", mode = "755" },
    { source = "target/release/typefix-gui", dest = "/usr/bin/typefix-gui", mode = "755" },
    { source = "../Resources/en_50k.txt", dest = "/usr/share/typefix/en_50k.txt", mode = "644" },
    { source = "../Resources/fa_50k.txt", dest = "/usr/share/typefix/fa_50k.txt", mode = "644" },
    { source = "packaging/typefix.desktop", dest = "/usr/share/applications/typefix.desktop", mode = "644" },
    { source = "../icon/icon_1024.png", dest = "/usr/share/icons/hicolor/1024x1024/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/typefix.png", mode = "644" },
    { source = "packaging/icons/typefix-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/typefix.png", mode = "644" },
    { source = "../LICENSE", dest = "/usr/share/licenses/typefix/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
setxkbmap = "*"
gtk3 = "*"
