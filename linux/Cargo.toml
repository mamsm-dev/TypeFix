[package]
name = "typefix-linux-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared English/Persian keyboard-layout mistake detection core"

[lib]
name = "typefix_core"
path = "src/lib.rs"

[[bin]]
name = "typefix-check"
path = "src/main.rs"

[[bin]]
name = "typefix-x11-probe"
path = "src/bin/x11_probe.rs"

[dependencies]
x11rb = { version = "0.13", features = ["xinput", "xkb"] }

[dev-dependencies]
x11rb = { version = "0.13", features = ["xtest"] }
xkbcommon = "0.9"
