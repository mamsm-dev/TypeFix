name: Linux core CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - "linux/**"
      - ".github/workflows/linux-core.yml"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/linux-core.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install XKB build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev xkb-data x11-xkb-utils
      - name: Test shared core
        run: cargo test --manifest-path linux/Cargo.toml
